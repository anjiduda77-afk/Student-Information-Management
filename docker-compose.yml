version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: ssis-mysql
    restart: always
    environment:
      MYSQL_DATABASE: student_information_system
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    networks:
      - ssis-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ssis-backend
    restart: always
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 8080
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/student_information_system?useSSL=false&serverTimezone=Asia/Kolkata&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      JWT_SECRET: mySecretKey1234567890mySecretKey1234567890mySecretKey1234567890
      CORS_ALLOWED_ORIGINS: http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174
    ports:
      - "8080:8080"
    networks:
      - ssis-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ssis-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"
    networks:
      - ssis-network

volumes:
  mysql-data:

networks:
  ssis-network:
    driver: bridge
